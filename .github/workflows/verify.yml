name: Verify

# 静态门禁聚合：类型、依赖边界、设计令牌、结构预算、单测。
# 与 ui-tokens / ui-overflow 分开：那两个是纯静态扫描/浏览器渲染，这里是完整 verify。
# 基线（tokens / structure）只许变小，脚本内部保证。

on:
  push:
    branches: [dev]
    paths:
      - "web/src/**"
      - "web/tests/**"
      - "web/scripts/**"
      - "web/package.json"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "web/src/**"
      - "web/tests/**"
      - "web/scripts/**"
      - "web/package.json"
      - ".github/workflows/verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify
        run: pnpm verify
