name: UI Overflow Check

# 桌面视口横向溢出回归检查。
# 背景：项目只支持桌面宽度。tsc / 单测 / 构建都抓不到 flex 子项不收缩
# 导致的横向溢出，只能在几种常见桌面窗口宽度下各渲染一遍。

on:
  push:
    branches: [dev]
    paths:
      - "web/src/**"
      - "web/scripts/check-overflow.mjs"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/ui-overflow.yml"
  pull_request:
    paths:
      - "web/src/**"
      - "web/scripts/check-overflow.mjs"
      - "web/package.json"
      - "web/pnpm-lock.yaml"

jobs:
  overflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 原来这里是 `corepack enable`，但整个 job 的 working-directory 是 web，
      # corepack 读不到 web/package.json 里的 packageManager，shim 没生成，
      # 下一步就报 `Unable to locate executable file: pnpm`。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Check horizontal overflow (1280 / 1440 / 1920)
        run: pnpm run check:overflow

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-overflow-artifacts
          path: web/ui-overflow-artifacts/
          if-no-files-found: ignore
          retention-days: 7
