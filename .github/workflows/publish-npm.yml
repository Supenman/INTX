name: Publish npm Packages

# 把 canvas-agent / canvas-proxy 发到 npm，走 Trusted Publishing（OIDC）。
#
# 不再存任何 npm token：job 里声明 id-token: write，npm 用 GitHub 签发的
# 短期身份令牌换取一次性的发布权限。令牌随 job 结束失效，泄漏无从谈起。
#
# 前置：npm 包页面上要绑定本仓库与本文件名（见 docs/品牌去上游-发布清单.md）。
# 版本号策略：GitHub Release 名带 tag（如 canvas-agent-v0.6.1）时，
# 发布前会校验 tag 与 package.json 的 version 一致；手动触发则用 package.json 的现值。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        type: choice
        options: [canvas-proxy, canvas-agent, both]
        default: both

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm 11.5+，而 node 22 自带的是 10.x
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Decide what to publish
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
          MANUAL: ${{ inputs.package }}
        run: |
          if [ -n "$TAG" ]; then
            case "$TAG" in
              canvas-agent-v*) echo "pkgs=canvas-agent" >> $GITHUB_OUTPUT ;;
              canvas-proxy-v*) echo "pkgs=canvas-proxy" >> $GITHUB_OUTPUT ;;
              *)
                echo "::error::Release tag '$TAG' 不认识。应以 canvas-agent-v 或 canvas-proxy-v 开头。"
                exit 1 ;;
            esac
          else
            echo "pkgs=${MANUAL}" >> $GITHUB_OUTPUT
          fi

      # tag 与 package.json 对不上时直接失败，避免发出一个版本号错乱的包。
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${{ steps.target.outputs.pkgs }}"
          want="${TAG#${name}-v}"
          have=$(node -p "require('./$name/package.json').version")
          echo "$name: tag=$want package.json=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::版本不一致：tag 是 $want，package.json 是 $have。先改 package.json 再打 tag。"
            exit 1
          fi

      - name: Publish canvas-proxy
        if: contains(fromJSON('["canvas-proxy","both"]'), steps.target.outputs.pkgs)
        working-directory: canvas-proxy
        run: npm publish --access public

      - name: Publish canvas-agent
        if: contains(fromJSON('["canvas-agent","both"]'), steps.target.outputs.pkgs)
        working-directory: canvas-agent
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm publish --access public
