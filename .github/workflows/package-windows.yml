name: Windows 安装包

# Linux 沙箱无法交叉编译 Windows 安装包（WebView2 / WiX / NSIS 都是 Windows 侧工具链），
# 所以 Windows 包由 GitHub-hosted windows-latest 产出，产物走 artifact 下载。
#
# 只在需要安装包时跑：手动触发、推 v2 分支、或打 v* tag。
# 日常 push 不编 Rust——首次全量编译要十几分钟，没必要每次都付这个成本。

on:
  workflow_dispatch:
  push:
    branches: [v2]
    tags: ['v*']

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建 .msi / .exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # windows-latest 预装稳定版 Rust、VS 2022 生成工具与 WebView2；显式钉一下工具链
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖（冻结锁文件）
        run: pnpm install --frozen-lockfile
      - name: Tauri 打包（beforeBuildCommand 会先跑 pnpm build 构建前端）
        run: pnpm tauri:build
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: intx-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
