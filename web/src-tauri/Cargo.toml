[package]
name = "intx"
version = "0.2.4-beta.3"
description = "INTX — 本地优先的 AI 创作画布"
authors = ["INTX"]
edition = "2021"
rust-version = "1.90"

# 桌面壳只负责开窗口。业务数据（画布、任务、产物）全在前端的
# IndexedDB / localforage 里，Rust 侧不重复实现一套存储，也不碰厂商请求。
[lib]
name = "intx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
# 桌面 WebView 同样执行 CORS 预检，ModelScope 的 X-ModelScope-Async-Mode
# 不在其允许头里，直连必被拦。厂商请求改走 Rust 侧（reqwest），彻底绕开跨域。
tauri-plugin-http = "2.5.0"
# M2.5-③ 原生另存为：系统保存对话框 + 写盘。dialog 选中的路径会在运行时
# 自动进入 fs scope（见 tauri-plugin-dialog 的 save 命令），所以 capabilities
# 里只给命令权限、不静态放开整个磁盘。
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.0"
# read_agent_config 要把 Agent 写下的 { url, token } 序列化给前端。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 桌面端把渠道 API Key 存进系统凭据库（Windows 凭据管理器 / macOS Keychain /
# Linux Secret Service），不再明文落在 localStorage。见 src/secrets.rs。
# 必须显式启用平台后端：keyring 3.x 无默认 feature，否则 Windows 上会退化为
# 内存 mock，凭据不会真正写入凭据管理器。
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }

# 打包走 `pnpm tauri:build`：CLI 会传 `--features tauri/custom-protocol`，
# 等价于打开这个 feature。裸 `cargo build --release` 不会，运行时 is_dev()
# 恒为 true、去连 devUrl，装到真机上就是 ERR_CONNECTION_REFUSED（旧 INTX
# 真机踩过）。lib.rs 的启动检查会把这种包拦下来并给出明确报错。
[features]
custom-protocol = ["tauri/custom-protocol"]
