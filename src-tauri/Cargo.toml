[package]
name = "intx"
version = "0.1.0"
description = "INTX — 本地优先的 AI 创作画布"
authors = ["INTX"]
edition = "2021"
rust-version = "1.90"

# 桌面壳只负责开窗口 + 挂 fs 插件。业务逻辑全在前端，
# 这里不放任何推理/网络代码，避免两套实现各自解释同一份数据。
[lib]
name = "intx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-fs = "2.7.1"

# Tauri CLI 跑 `tauri build` 时会自动启用这个 feature，但裸
# `cargo build` / `cargo xwin build` 不会。缺了它 is_dev() 恒为 true，
# 运行时去连 devUrl(http://127.0.0.1:7351)，装到真机上就是
# 「嗯… 无法访问此页面 / ERR_CONNECTION_REFUSED」。
# 交叉打包必须显式带 --features custom-protocol，见 scripts/build-windows.sh。
[features]
custom-protocol = ["tauri/custom-protocol"]
